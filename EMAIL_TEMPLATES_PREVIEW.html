<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Core Asistan · E-posta önizlemeleri</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        color: #17201b;
        background: #f4f6f4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .page {
        max-width: 1540px;
        margin: 0 auto;
        padding: 38px 30px 72px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #236347;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(27px, 3vw, 40px);
        line-height: 1.15;
        letter-spacing: -0.035em;
      }

      .intro {
        max-width: 790px;
        margin: 14px 0 0;
        color: #5b6960;
        font-size: 14px;
        line-height: 1.65;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin: 30px 0 22px;
        padding: 14px;
        border: 1px solid #e1e7e2;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 9px 28px rgba(19, 46, 31, 0.05);
      }

      .search {
        width: min(100%, 280px);
        height: 38px;
        padding: 0 12px;
        border: 1px solid #dce4de;
        border-radius: 9px;
        outline: none;
        font: inherit;
        font-size: 13px;
      }

      .search:focus {
        border-color: #177245;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .filter {
        min-height: 35px;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: #58675d;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
      }

      .filter:hover {
        background: #f0f5f1;
      }
      .filter[aria-pressed="true"] {
        background: #e7f4ec;
        color: #145a38;
      }

      .count {
        margin-left: auto;
        white-space: nowrap;
        color: #6b776d;
        font-size: 12px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .item {
        min-width: 0;
        overflow: hidden;
        border: 1px solid #dfe6e0;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 8px 32px rgba(19, 46, 31, 0.035);
      }

      .item-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        min-height: 66px;
        padding: 16px 18px 14px;
        border-bottom: 1px solid #edf0ed;
      }

      .item h2 {
        margin: 0;
        font-size: 14px;
        line-height: 1.4;
      }
      .item p {
        margin: 4px 0 0;
        color: #758278;
        font-size: 11px;
      }

      .tag {
        flex-shrink: 0;
        padding: 5px 8px;
        border-radius: 6px;
        background: #f1f5f2;
        color: #486553;
        font-size: 10px;
        font-weight: 700;
      }

      iframe {
        display: block;
        width: 100%;
        height: 350px;
        border: 0;
      }

      .item--branded iframe {
        height: 640px;
      }

      .item--inventory iframe {
        height: 840px;
      }

      .item--channel iframe {
        height: 700px;
      }

      .item--capacity iframe {
        height: 690px;
      }

      .item--security iframe {
        height: 660px;
      }

      .item--billing iframe {
        height: 790px;
      }

      .empty {
        padding: 45px 20px;
        border: 1px dashed #ccd7ce;
        border-radius: 14px;
        color: #66746a;
        text-align: center;
      }

      @media (max-width: 940px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 600px) {
        .page {
          padding: 26px 14px 48px;
        }
        .toolbar {
          top: 0;
          margin-top: 24px;
        }
        .search {
          width: 100%;
        }
        .count {
          width: 100%;
          margin: 0;
        }
        iframe {
          height: 380px;
        }
        .item--branded iframe {
          height: 710px;
        }
        .item--inventory iframe {
          height: 980px;
        }
        .item--channel iframe {
          height: 790px;
        }
        .item--capacity iframe {
          height: 800px;
        }
        .item--security iframe {
          height: 750px;
        }
        .item--billing iframe {
          height: 900px;
        }
      }
    </style>
  </head>

        sayılar örnektir. Bu sayfa e-posta göndermez.
      </p>

        <input
          class="search"
          id="search"

        <div

        <span class="count" id="count"></span>
      </div>

      <div class="grid" id="gallery"></div>
    </main>

                      <h1 style="margin:0 0 20px;color:#1f3026;font-size:23px;font-weight:700;line-height:1.35;letter-spacing:-.01em">${escapeHtml(example.title)}</h1>
                      <p style="margin:0 0 10px;color:#26382c;font-size:14px;line-height:1.7">Merhaba Ayşe,</p>
                      <p style="margin:0 0 23px;color:#536158;font-size:14px;line-height:1.7">${escapeHtml(example.message)}</p>
                      ${options.detail}
                      <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:separate;border-spacing:0"><tr><td bgcolor="#174b38" style="padding:12px 18px;border-radius:6px;background:#174b38"><a href="${escapeHtml(actionUrl)}" target="_blank" rel="noopener noreferrer" style="color:#ffffff;font-size:13px;font-weight:700;line-height:1.4;text-decoration:none">${escapeHtml(options.buttonLabel)}</a></td></tr></table>
                    </td></tr>
                  </table>
                  <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;border-collapse:collapse"><tr><td style="padding:19px 8px 0;text-align:center;color:#88928b;font-size:11px;line-height:1.7">
                    Bu e-posta Core Asistan tarafından otomatik olarak gönderilmiştir.<br>
                    Bu tür e-postaları almak istemiyorsanız <a href="${escapeHtml(preferencesUrl)}" target="_blank" rel="noopener noreferrer" style="color:#2563a6;text-decoration:underline">bildirim tercihlerinizi yönetin</a>.
                  </td></tr></table>
                </td></tr>
              </table>
            </body>
          </html>`;
      }

      function renderFilters() {
        filters.replaceChildren(
          ...groups.map((group) => {
            const button = document.createElement("button");
            button.className = "filter";
            button.type = "button";
            button.textContent = group;
            button.setAttribute(
              "aria-pressed",
              String(selectedGroup === group),
            );
            button.addEventListener("click", () => {
              selectedGroup = group;
              renderFilters();
              renderGallery();
            });
            return button;
          }),
        );
      }

      function renderGallery() {
        const query = search.value.trim().toLocaleLowerCase("tr-TR");
        const visible = examples.filter(
          (example) =>
            (selectedGroup === "Tümü" || selectedGroup === example.group) &&
            `${example.group} ${example.label} ${example.title} ${example.message}`
              .toLocaleLowerCase("tr-TR")
              .includes(query),
        );
        count.textContent = `${visible.length} / ${examples.length} örnek`;
        if (visible.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "Bu aramayla eşleşen e-posta bulunamadı.";
          gallery.replaceChildren(empty);
          return;
        }
        gallery.replaceChildren(
          ...visible.map((example) => {
            const item = document.createElement("article");
            item.className =
              example.template === "BILLING_EVENT"
                ? "item item--billing"
                : example.template === "SECURITY_EVENT"
                  ? "item item--security"
                  : example.template === "PRODUCT_CAPACITY"
                    ? "item item--capacity"
                    : example.template?.startsWith("CHANNEL_")
                      ? "item item--channel"
                      : example.template?.startsWith("INVENTORY_")
                        ? "item item--inventory"
                        : example.template
                          ? "item item--branded"
                          : "item";
            const head = document.createElement("div");
            head.className = "item-head";
            const heading = document.createElement("div");
            const title = document.createElement("h2");
            title.textContent = example.label;
            const subject = document.createElement("p");
            subject.textContent = `Konu: ${example.title}`;
            heading.append(title, subject);
            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = example.group;
            head.append(heading, tag);
            const preview = document.createElement("iframe");
            preview.title = `${example.label} e-posta önizlemesi`;
            preview.loading = "lazy";
            preview.setAttribute(
              "sandbox",
              "allow-same-origin allow-popups allow-popups-to-escape-sandbox",
            );
            if (example.template === "BILLING_EVENT") {
              preview.addEventListener("load", () => {
                const content =
                  preview.contentDocument?.querySelector("body > table");
                if (!content) return;
                const fitHeight = () => {
                  preview.style.height = `${Math.ceil(content.getBoundingClientRect().height) + 2}px`;
                };
                fitHeight();
                new ResizeObserver(fitHeight).observe(content);
              });
            }
            preview.srcdoc = emailHtml(example);
            item.append(head, preview);
            return item;
          }),
        );
      }

      search.addEventListener("input", renderGallery);
      renderFilters();
      renderGallery();
    </script>
  </body>
</html>
