name: Quality
on:
  pull_request:
  push:
    branches: [main, master, ci/production-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:local_test_only@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:local_test_only@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      BILLING_TEST_LIMITS_ENABLED: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local_test_only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Validate deployment environment isolation
        working-directory: .
        run: node --test deploy/compose-config.test.mjs
      - run: npm audit --omit=dev
      - run: npm run db:generate
      - run: npm run check
      - name: Run available integration tests
        if: ${{ hashFiles('backend/src/**/*.integration.spec.ts') != '' }}
        run: npm run test:integration

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: https://api.example.invalid
      NEXT_PUBLIC_PADDLE_ENV: sandbox
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
